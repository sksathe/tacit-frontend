# Render static site — repo root is tacit-frontend (no Root Directory override needed).
services:
  - type: web
    name: tacit-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      # Proxy API to backend when VITE_API_BASE_URL is empty (same-origin /api/*).
      # Replace the destination host with your deployed tacit-backend URL.
      - type: rewrite
        source: /api/*
        destination: https://YOUR-TACIT-BACKEND.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
